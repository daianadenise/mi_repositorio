<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching Motivacional</title>
    <link rel="stylesheet" href="estilo.css">
       
</head>
<body>
    <header>
        <h1>Coaching Motivacional y Desarrollo Personal</h1>
    </header>
    <main>
        <section>
            <h2>Mensaje de Motivación Personalizado</h2>
            <p>Por favor, selecciona tu estado de ánimo:</p>
            <select id="estadoAnimo">
                <option value="" disabled selected>Selecciona tu estado de ánimo</option>
                <option value="feliz">Feliz</option>
                <option value="triste">Triste</option>
                <option value="ansioso">Ansioso</option>
                <option value="motivado">Motivado</option>
            </select>
            <button onclick="mostrarMensajeMotivacional()">Mostrar Mensaje</button>
            <p id="mensajeMotivacional"></p>
        </section>

        <section>
            <h2>Lista de Tareas</h2>
            <ul id="listaTareas">
                <!-- Las tareas se cargan desde la base de datos con JavaScript -->
            </ul>
            <p id="estadoConexion"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
